name: architecture_starter_kit
description: Flutter Architecture Starter Kit — BLoC, Clean Architecture, Mock APIs, Real-Time
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5
  get_it: ^7.7.0
  dio: ^5.7.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  dartz: ^0.10.1
  go_router: ^14.6.2
  connectivity_plus: ^6.1.0
  shared_preferences: ^2.3.3
  requests_inspector: ^5.4.0
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
